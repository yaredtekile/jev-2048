[project]
name = "jev-2048"
version = "0.1.0"
description = "Watch TypeSafe Jev play 2048 in a real browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "typesafe-sdk>=0.1.0",
  "playwright>=1.48.0",
]

[project.scripts]
jev-2048 = "jev_2048.play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_2048"]
